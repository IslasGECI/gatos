name: Tests
on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master
jobs:
  actions:
    runs-on: ubuntu-latest
    steps:
    - name: Copia repositorio
      uses: actions/checkout@v2
    - name: Construye imagen
      run: docker build --tag islasgeci/gatos .
    - name: Verifica el formato
      run: docker run islasgeci/gatos make check
    - name: Corre pruebas
      run: docker run islasgeci/gatos make tests
    - name: Evalua resistencia a mutaciones
      run: docker run islasgeci/gatos make mutants
