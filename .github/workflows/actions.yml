name: Push latest
on: push
jobs:
  actions:
    runs-on: ubuntu-latest
    environment: pypi_token
    permissions:
      id-token: write
      contents: write
    steps:
    - name: Copia repositorio
      uses: actions/checkout@main
    - name: Construye imagen
      run: docker build --tag islasgeci/gatos:latest --tag islasgeci/gatos:${GITHUB_SHA:0:4} .
    - name: Verifica el formato
      run: docker run islasgeci/gatos:latest make check
    - name: Corre pruebas y evalúa cobertura
      run: docker run --volume $PWD:/workdir islasgeci/gatos:latest make coverage
    - name: Upload coverage reports to Codecov with GitHub Action
      uses: codecov/codecov-action@main
      with:
        files: ./coverage.xml
        verbose: true
    - name: Create/Update tag
      uses: rickstaa/action-create-tag@main
      with:
        tag: "latest"
        message: "Latest release"
        force_push_tag: true
    - name: Docker log-in
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin
    - name: Sube latest a Docker Hub
      run: docker push islasgeci/gatos:latest
    - name: Sube sha a Docker Hub
      run: docker push islasgeci/gatos:${GITHUB_SHA:0:4}
    - name: Set up Python 3.x
      uses: actions/setup-python@main
      with:
        python-version: '3.x'
    - name: Install pypa/build
      run: >-
        python -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: >-
        python -m
        build
        --sdist
        --wheel
        --outdir dist/
        .
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
